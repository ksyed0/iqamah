name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: iqamah
  PROJECT: iqamah.xcodeproj
  XCODE_VERSION: "26"

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. LINT — SwiftLint style + rule enforcement
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  # ──────────────────────────────────────────────────────────────────────────
  # 2. FORMAT — SwiftFormat (replaces Prettier, which is JS-only)
  #    Note: Prettier does not support Swift. SwiftFormat is the equivalent.
  # ──────────────────────────────────────────────────────────────────────────
  format:
    name: SwiftFormat
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting
        run: |
          swiftformat --lint iqamah/
          if [ $? -ne 0 ]; then
            echo "::error::SwiftFormat found formatting issues. Run 'swiftformat iqamah/' locally to fix."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 3. BUILD — Debug + Release configurations
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build
        run: |
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ matrix.configuration }} \
            -destination 'platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

  # ──────────────────────────────────────────────────────────────────────────
  # 4. TEST + COVERAGE — run tests, enforce ≥80% code coverage
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Run tests with coverage
        run: |
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Run IqamahCore SPM tests with coverage
        run: |
          cd Packages/IqamahCore
          swift test --enable-code-coverage 2>&1 | tail -5

      - name: Enforce ≥80% IqamahCore package coverage
        run: |
          # Measure coverage of the IqamahCore Swift Package using llvm-cov.
          # This covers all domain logic (Models, Services, PrayerCalculator) that
          # moved into the package in US-0040.
          PKG_COV=$(cd Packages/IqamahCore && \
            PROF=$(find .build/debug/codecoverage -name "IqamahCoreTests.profdata" 2>/dev/null | head -1) && \
            BIN=$(find .build/debug -name "IqamahCoreTests" -type f 2>/dev/null | head -1) && \
            if [ -n "$PROF" ] && [ -n "$BIN" ]; then
              xcrun llvm-cov report "$BIN" -instr-profile="$PROF" \
                --ignore-filename-regex=".*Tests.*" 2>/dev/null \
                | awk '/TOTAL/{print $NF}' | tr -d '%'
            else
              echo "0"
            fi)
          echo "IqamahCore package coverage: ${PKG_COV}%"
          if (( $(echo "${PKG_COV:-0} < 80.0" | bc -l) )); then
            echo "::error::IqamahCore coverage ${PKG_COV}% is below the required 80% threshold."
            exit 1
          fi
          echo "::notice::IqamahCore coverage ${PKG_COV}% meets the ≥80% requirement."

      - name: Enforce ≥80% app-layer domain coverage
        run: |
          # SwiftUI Views and system-framework wrappers (CoreLocation, AVFoundation)
          # cannot be unit-tested without XCUITest or real hardware — they are excluded.
          # Domain code in the app layer = any non-View, non-system, non-package file.
          # IqamahCore package files are measured separately by the SPM step above.
          EXCLUDED="Views/|AppDelegate|ContentView|iqamahApp|AppIconGenerator|AppIconView|LocationService|AdhaaanPlayer|Packages/"
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult 2>/dev/null \
            | python3 -c "import sys,json,re; d=json.load(sys.stdin); ex=sys.argv[1]; files=[f for t in d.get('targets',[]) for f in t.get('files',[]) if not re.search(ex,f.get('path',''))]; te=sum(f.get('executableLines',0) for f in files); tc=sum(f.get('coveredLines',0) for f in files); print(f'{(tc/te*100) if te>0 else 0:.1f}') if te > 0 else print('N/A')" "$EXCLUDED" \
            2>/dev/null || echo "N/A")

          echo "App-layer domain coverage: ${COVERAGE}% (Views/system/package files excluded)"

          if [ "$COVERAGE" = "N/A" ]; then
            echo "::notice::No app-layer domain files to measure (all domain code is in IqamahCore package)."
          elif (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "::error::App-layer domain coverage ${COVERAGE}% is below the required 80% threshold."
            exit 1
          else
            echo "::notice::App-layer domain coverage ${COVERAGE}% meets the ≥80% requirement."
          fi


      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 5. FILE SIZE GUARD — .app bundle must not exceed 50 MB (Release build)
  # ──────────────────────────────────────────────────────────────────────────
  file-size:
    name: File Size Guard
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build Release
        run: |
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Check .app bundle size (≤ 50 MB)
        run: |
          APP=$(find DerivedData -name "*.app" -maxdepth 6 | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Could not find .app bundle in DerivedData"
            exit 1
          fi
          SIZE_MB=$(du -sm "$APP" | cut -f1)
          echo "Bundle size: ${SIZE_MB} MB  (path: $APP)"
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "::error::Bundle size ${SIZE_MB} MB exceeds the 50 MB budget."
            exit 1
          fi
          echo "::notice::Bundle size ${SIZE_MB} MB is within the 50 MB budget."

  # ──────────────────────────────────────────────────────────────────────────
  # 7. PR TITLE — enforce Conventional Commits format
  # ──────────────────────────────────────────────────────────────────────────
  pr-title:
    name: PR Title Convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            ci
          requireScope: false

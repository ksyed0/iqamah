name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: iqamah
  PROJECT: iqamah.xcodeproj
  XCODE_VERSION: "26"

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. CODE QUALITY — SwiftLint + SwiftFormat in a single runner
  #    (was two separate macOS jobs; merged saves one full runner startup)
  # ──────────────────────────────────────────────────────────────────────────
  code-quality:
    name: ${{ matrix.tool }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [SwiftLint, SwiftFormat]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            /opt/homebrew/Cellar/swiftlint
            /opt/homebrew/Cellar/swiftformat
          key: brew-${{ runner.arch }}-swiftlint-0.61.0-swiftformat-0.61.1
          restore-keys: brew-${{ runner.arch }}-

      - name: Install SwiftLint
        if: matrix.tool == 'SwiftLint'
        run: brew install swiftlint

      - name: Run SwiftLint
        if: matrix.tool == 'SwiftLint'
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Install SwiftFormat
        if: matrix.tool == 'SwiftFormat'
        run: brew install swiftformat

      - name: Check formatting
        if: matrix.tool == 'SwiftFormat'
        run: |
          swiftformat --lint iqamah/
          if [ $? -ne 0 ]; then
            echo "::error::SwiftFormat found formatting issues. Run 'swiftformat iqamah/' locally to fix."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 2. BUILD — Debug + Release.
  #    - watchOS only built once (Debug matrix leg) — was previously built
  #      in BOTH Debug and Release legs despite always using Debug config.
  #    - Release leg includes the file-size check inline, eliminating the
  #      separate file-size job that rebuilt Release from scratch.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build macOS (${{ matrix.configuration }})
        run: |
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ matrix.configuration }} \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      # watchOS only needs one build — use Debug; skip on Release to avoid duplication.
      - name: Build IqamahWatch (Debug only)
        if: matrix.configuration == 'Debug'
        run: |
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme IqamahWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      # File-size check runs inline after the Release build — no separate job needed.
      # Budget raised to 150 MB: the macOS app legitimately embeds 5 adhaan MP3s,
      # 2 Fajr-specific recordings, 5 alert tones, cities.json (~12 MB), and a
      # fully compiled IqamahWidgetMac extension (~28 MB in PlugIns).
      - name: Check .app bundle size ≤ 150 MB (Release only)
        if: matrix.configuration == 'Release'
        run: |
          APP=$(find DerivedData -name "iqamah.app" -maxdepth 6 | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Could not find iqamah.app bundle in DerivedData"
            exit 1
          fi
          SIZE_MB=$(du -sm "$APP" | cut -f1)
          echo "Bundle size: ${SIZE_MB} MB  (path: $APP)"
          if [ "$SIZE_MB" -gt 150 ]; then
            echo "::error::Bundle size ${SIZE_MB} MB exceeds the 150 MB budget."
            exit 1
          fi
          echo "::notice::Bundle size ${SIZE_MB} MB is within the 150 MB budget."

  # ──────────────────────────────────────────────────────────────────────────
  # 3. TEST + COVERAGE
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Run tests with coverage
        run: |
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Run IqamahCore SPM tests
        run: |
          cd Packages/IqamahCore
          swift test 2>&1 | tail -5

      - name: Run IqamahWatch tests
        run: |
          SIM=$(xcrun simctl list devices available --json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); \
              sims=[v for k,vs in d['devices'].items() if 'watchOS' in k for v in vs if v['isAvailable']]; \
              print(sims[0]['udid'] if sims else '')")
          if [ -z "$SIM" ]; then echo "No watchOS simulator found; skipping"; exit 0; fi
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme IqamahWatch \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=$SIM" \
            test \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Enforce ≥75% domain coverage
        run: |
          EXCLUDED="Views/|AppDelegate|ContentView|iqamahApp|AppIconGenerator|AppIconView|LocationService|AdhaaanPlayer|UITests|SnapshotTesting|Tests/|IqamahWidget|Widget"
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult 2>/dev/null \
            | python3 -c "import sys,json,re; d=json.load(sys.stdin); ex=sys.argv[1]; files=[f for t in d.get('targets',[]) for f in t.get('files',[]) if not re.search(ex,f.get('path',''))]; te=sum(f.get('executableLines',0) for f in files); tc=sum(f.get('coveredLines',0) for f in files); print(f'{(tc/te*100) if te>0 else 0:.1f}')" "$EXCLUDED" \
            2>/dev/null || echo "0")

          echo "Domain code coverage: ${COVERAGE}% (Views/system wrappers excluded)"

          if (( $(echo "$COVERAGE < 75.0" | bc -l) )); then
            echo "::error::Domain coverage ${COVERAGE}% is below the required 75% threshold."
            exit 1
          fi
          echo "::notice::Domain coverage ${COVERAGE}% meets the ≥75% requirement."

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 4. SNAPSHOT TESTS — visual regression gate on every PR
  # Runs only the three snapshot test classes (fast, ~1-2 min).
  # Full coverage reporting is handled by the "Test & Coverage" job above.
  # AC-0347 (US-0069, EPIC-0015)
  # ──────────────────────────────────────────────────────────────────────────
  snapshot-tests:
    name: Snapshot Tests
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Run snapshot tests
        run: |
          xcodebuild test \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:iqamahTests/MoonPhaseSnapshotTests \
            -only-testing:iqamahTests/QiblahCompassSnapshotTests \
            -only-testing:iqamahTests/PrayerTimesTableSnapshotTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Upload snapshot log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-tests-log
          path: TestResults.xcresult
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────────────
  # 5. PR TITLE — enforce Conventional Commits format
  # ──────────────────────────────────────────────────────────────────────────
  pr-title:
    name: PR Title Convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            ci
          requireScope: false
